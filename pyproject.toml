[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv", ".devcontainer"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["analytics", "ETL_ADR_Argentina"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
